[package]
name = "shape-domain"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Shape contributors"]
license = "MIT"
publish = false

[dependencies]
blake3 = "1.8.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
uuid = { version = "1.23.2", features = ["serde", "std", "v7"] }


[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
